name: Upload to App Store

# =============================================================================
# Manually-triggered App Store Connect uploads via fastlane deliver (#230, #236, #239). One workflow, pick a
# lane:
#   • ensure_version     — create the editable App Store version record for MARKETING_VERSION if one is
#     missing (a DRAFT only — no build/submit/release; #239). Idempotent. The upload lanes below call it
#     first, so you rarely run it directly.
#   • upload_screenshots — ship the framed marketing screenshots committed under
#     screenshots/appstore/framed/, then self-dedup (deliver's verify-race leaves 2× of each).
#   • dedup_screenshots  — clean an already-duplicated screenshot set, no upload.
#   • upload_metadata    — push the App Store TEXT metadata (fastlane/metadata/<locale>/*.txt:
#     description, keywords, subtitle, URLs). See fastlane/metadata/README.md for the managed set.
# All lanes are metadata / image / version-DRAFT ONLY — never the binary, never a review submission.
#
# WHY LINUX / NO XCODE: deliver only talks to the ASC API, and the screenshots are pre-generated on a Mac
# + committed, so this workflow needs no simulator/Xcode/photos — just the committed files + the ASC API
# key. DELIBERATELY separate from ci.yml (never gates PR CI) and testflight.yml (no signing). Triggered
# ONLY by an explicit human workflow_dispatch, behind the protected `testflight` environment.
#
# ---------------------------------------------------------------------------
# BEFORE RUNNING
# ---------------------------------------------------------------------------
#   • An EDITABLE App Store version ("Prepare for Submission") is what everything attaches to. You no longer
#     have to create it by hand: the upload lanes call `ensure_version` first (creates the draft for
#     MARKETING_VERSION if missing), or run the `ensure_version` lane on its own after a bump.
#   • Screenshots: generate + commit the framed set (Scripts/appstore-screenshots.sh →
#     `node Scripts/framing/frame-all.mjs` → commit screenshots/appstore/framed/). The lane size-checks
#     every image, aborts on a missing set, and self-dedups — it never pushes a partial/empty set silently.
#   • Metadata: edit fastlane/metadata/<locale>/*.txt (the lane refuses empty files — an empty file wipes
#     the ASC field — and enforces the char limits).
#   • Trigger (Actions → Upload to App Store → Run workflow), pick the lane, approve the reviewer gate.
#
# REQUIRED `testflight` ENVIRONMENT SECRETS (a subset of the TestFlight lane's —
# no match/signing secrets needed here):
#   ASC_KEY_ID              App Store Connect API key id
#   ASC_ISSUER_ID           App Store Connect API issuer id
#   ASC_KEY_CONTENT_BASE64  base64 of the .p8 private key
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "lane: ensure_version (create draft) | upload_screenshots (+self-dedup) | dedup_screenshots (clean dupes) | upload_metadata (text)"
        type: choice
        default: upload_screenshots
        options:
          - ensure_version
          - upload_screenshots
          - dedup_screenshots
          - upload_metadata

# Least privilege: reads the repo (for the committed framed set); uploads to ASC
# via the API key, not the GITHUB_TOKEN.
permissions:
  contents: read

# Never run two uploads at once; do not cancel an in-flight upload.
concurrency:
  group: upload-screenshots
  cancel-in-progress: false

jobs:
  upload:
    name: Upload to App Store Connect (deliver)
    # No Xcode/simulator needed — deliver only talks to the ASC API. Linux is faster
    # and cheaper than a macOS runner for a pure API upload.
    runs-on: ubuntu-latest
    # Binds the required-reviewer gate + scopes the ASC secrets to this job only.
    environment: testflight

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby + bundler
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install gems (frozen)
        run: |
          # Frozen install: refuse to change Gemfile.lock, so the resolved graph is
          # exactly what was committed (supply-chain pinning).
          bundle config set --local frozen true
          bundle install --jobs 4

      - name: Run fastlane ${{ github.event.inputs.lane }}
        # No `set -x`, no `--verbose`: the ASC key must never reach the log.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          bundle exec fastlane "${{ github.event.inputs.lane }}"

      - name: Upload fastlane report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upload-screenshots-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: fastlane/report.xml
